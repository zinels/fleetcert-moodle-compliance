services:
  db:
    image: mysql:8.0
    env_file: .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -e "SELECT 1" $$MYSQL_DATABASE']
      interval: 10s
      retries: 30
  moodle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./local/fleetcert:/var/www/html/local/fleetcert:ro
      - data:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  data:
