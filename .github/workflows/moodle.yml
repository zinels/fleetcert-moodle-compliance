name: Moodle integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: moodleci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pmoodleci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, zip, gd, soap, mbstring, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install Moodle test tooling
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install disposable Moodle and test database
        run: moodle-plugin-ci install --plugin ./plugin/local/fleetcert --db-host=127.0.0.1 --db-user=root --db-pass=moodleci
        env:
          DB: mysqli
          MOODLE_BRANCH: v4.5.15
      - name: Run plugin PHPUnit tests
        run: moodle-plugin-ci phpunit
